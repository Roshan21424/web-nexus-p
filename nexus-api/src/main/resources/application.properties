# Server configuration
spring.application.name=nexus
server.port=8080

# JWT configuration
spring.app.jwtSecret=npx0X5y8J7frOX9+dlRtPb+MCjQs3QR1ZfH8XYG4L5M=
spring.app.jwtExpirationsMS=3600000

# MySQL — reads from docker-compose environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB — reads from docker-compose environment variable
spring.mongodb.uri=${SPRING_MONGODB_URI}

# Multipart & Compression (unchanged)
spring.servlet.multipart.enabled=true
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml
server.compression.min-response-size=1024